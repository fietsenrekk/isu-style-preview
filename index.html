<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labi — preview</title>
<meta name="robots" content="noindex, nofollow">
<!--
  PREVIEW / PITCH MOCKUP — not the production Labi site.

  This page reproduces the exact composition of isu-antwerp.com's homepage —
  logo placement, the two typefaces (Bebas Neue for UI/nav, Abel for body),
  the vertical left-hand nav, the centred hero frame at ISU's own measured
  proportions — with Labi's own wordmark and content standing in for ISU's.
  Measured directly from the live site on 2026-08-17: font-family, font-size,
  colour and bounding-box of the logo, tagline, nav and button; nothing here
  is guessed.

  Nothing is clickable by design (per the brief this ships to demonstrate the
  visual direction, not the finished site) except the mobile menu toggle,
  which costs nothing to wire up honestly.
-->
<style>
@font-face {
  font-family: 'Bebas Neue';
  src: url('assets/fonts/bebas-neue-latin.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Abel';
  src: url('assets/fonts/abel-latin.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}

:root {
  /* Sampled from isu-antwerp.com: body background rgb(252,252,252), text
     black. Kept as tokens rather than hard-coded so the one deliberate
     brand substitution (their palette, our wordmark) stays easy to audit. */
  --paper: #fcfcfc;
  --ink: #000;
  --rule: #000;
  --gutter: clamp(1.5rem, 5vw, 4.5rem);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Abel', Arial, sans-serif;
  min-height: 100svh;
}

.notice {
  background: #fff3cd;
  color: #664d03;
  font-family: Arial, sans-serif;
  font-size: 0.8rem;
  text-align: center;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid #e5c56b;
}

.page {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: calc(100svh - 2rem);
  padding: clamp(1.25rem, 4vw, 2.75rem) var(--gutter) clamp(2rem, 6vw, 3.5rem);
}

/* --------------------------------------------------------------- header --- */

.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
}

/* The hamburger — mobile only. ISU's own is two short offset bars over one
   longer bar; reproduced at the same rough proportions. */
.burger {
  display: none;
  flex-direction: column;
  gap: 6px;
  background: none;
  border: 0;
  padding: 0.4rem 0.2rem;
  cursor: pointer;
}
.burger span { display: block; height: 3px; background: var(--ink); }
.burger span:nth-child(1) { width: 20px; }
.burger span:nth-child(2) { width: 32px; margin-left: 8px; }

/* Logo block — top-right, right-aligned, matching ISU's measured position
   and proportions (their lockup rendered at ~145x83 in a 1057px viewport). */
.brand {
  text-align: right;
  margin-left: auto;
}
.brand__mark {
  width: clamp(6rem, 14vw, 9.5rem);
  height: auto;
  color: var(--ink);
  display: block;
  margin-left: auto;
}
.brand__rule {
  height: 3px;
  background: var(--rule);
  margin: 0.4rem 0 0.35rem;
  width: 100%;
}
.brand__tagline {
  font-family: 'Bebas Neue', Arial, sans-serif;
  font-size: clamp(1rem, 2.2vw, 1.375rem);
  letter-spacing: 0.01em;
  line-height: 1;
  color: var(--ink);
}

/* ----------------------------------------------------------------- hero --- */

.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: clamp(1.5rem, 5vh, 3rem);
}

/*
  Sized to ISU's own measured embed: 634x358 at a 1057px viewport — a hair
  under 60% of viewport width, ~1.77:1. Reproduced as a fluid box holding the
  same ratio rather than a fixed pixel size, so it holds proportion at every
  breakpoint instead of just matching one snapshot.
*/
.hero__frame {
  width: min(60vw, 68rem);
  aspect-ratio: 634 / 358;
  overflow: hidden;
  background: #ddd;
}
.hero__frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  /*
    Biased up from centre (50% 50%) to 50% 28%.

    The source photo is 709x945 (3:4) — an almost exact match for the mobile
    frame below, but the desktop frame is a wide ~1.77:1 box copied from ISU's
    own measured embed, so covering it crops out roughly 58% of the photo's
    height. Centred, that crop line fell mid-forearm and lost the clippers and
    hairline off the top. Shifted up, it keeps the hand, the clippers and the
    fade in frame and trims from the lower torso instead, which is the part of
    the frame doing the least work.
  */
  object-position: 50% 28%;
  display: block;
}
@media (max-width: 56em) {
  /* The mobile frame is 3:4 - the same ratio as the source photo - so no
     crop happens; centred is correct here. */
  .hero__frame img { object-position: 50% 50%; }
}

@media (max-width: 56em) {
  .hero__frame { width: 100vw; aspect-ratio: 3 / 4; margin-inline: calc(-1 * var(--gutter)); }
}

/* ------------------------------------------------------------------ nav --- */

/*
  Desktop: a plain block list, left-aligned, sitting low — reproduced at
  ISU's own measured font treatment (Bebas Neue, 22px, black, no extra
  tracking beyond what the face already has).
*/
.nav {
  font-family: 'Bebas Neue', Arial, sans-serif;
}
.nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav li { line-height: 1.35; }
.nav a {
  color: var(--ink);
  text-decoration: none;
  font-size: 1.375rem;
  cursor: default; /* inert by design — see the note in <head> */
}
.nav a:hover, .nav a:focus-visible { text-decoration: underline; }

/* ------------------------------------------------------- mobile nav ------ */

@media (max-width: 56em) {
  .burger { display: flex; }
  .nav {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: flex;
    align-items: center;
    padding: 2rem var(--gutter);
    transform: translateY(-100%);
    transition: transform 320ms ease;
    z-index: 20;
  }
  .nav[data-open='true'] { transform: translateY(0); }
  .nav a { font-size: clamp(2rem, 9vw, 3rem); }
  .nav li + li { margin-top: 0.5rem; }
  .nav__close {
    position: absolute;
    top: 1.25rem; right: var(--gutter);
    background: none; border: 0; font-family: 'Bebas Neue', Arial, sans-serif;
    font-size: 1.1rem; cursor: pointer; color: var(--ink);
  }
}
@media (min-width: 56.01em) {
  .nav__close { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .nav { transition: none; }
}
</style>
</head>

<script>
  // The one working interaction: the mobile menu toggle. Everything else on
  // this preview is inert by request.
  var burger = document.getElementById('burgerBtn');
  var closeBtn = document.getElementById('closeBtn');
  var nav = document.getElementById('nav');
  var links = nav.querySelectorAll('a');

  function openNav() {
    nav.dataset.open = 'true';
    burger.setAttribute('aria-expanded', 'true');
    links.forEach(function (a) { a.removeAttribute('tabindex'); });
    closeBtn.removeAttribute('tabindex');
  }
  function closeNav() {
    nav.dataset.open = 'false';
    burger.setAttribute('aria-expanded', 'false');
    links.forEach(function (a) { a.setAttribute('tabindex', '-1'); });
  }
  burger.addEventListener('click', openNav);
  closeBtn.addEventListener('click', closeNav);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && nav.dataset.open === 'true') closeNav();
  });
</script>
