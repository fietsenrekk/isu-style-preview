<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIRU — make a reservation</title>
<meta name="description" content="KIRU — make a reservation. A visual-direction preview.">
<meta name="robots" content="noindex, nofollow">
<!--
  PREVIEW / PITCH MOCKUP — not a live business site.

  Mirrors the structure of isu-antwerp.com/reservation.html: the same header
  lockup, a centred booking panel, and a footer carrying the address, the email
  and the Instagram handle.

  ISU drops a third-party booking widget straight into an iframe on this page,
  and so does this. The frame is the real Setmore booking page, so availability,
  services, durations and prices are live and every booking lands in the owner's
  Setmore calendar the instant it is made - nothing to sync, no backend, and the
  visitor never leaves the site. See the note above the iframe for the two
  caveats that come with it.

  The address, email and Instagram handle in the footer are Labi's real ones,
  used as stand-in filler under the KIRU name by request. They are live and they
  reach Labi.
-->
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="reservation">

<div class="page">

  <div id="curtain" class="idle" aria-hidden="true"><span class="bck"></span></div>

  <span class="preview-flag">PREVIEW MOCKUP</span>

  <header class="head">
    <h1 class="head__title">
      <a class="head__mark" href="index.html">
        <picture>
          <source type="image/webp" srcset="assets/brand/kiru-logo.webp">
          <img src="assets/brand/kiru-logo.png" width="880" height="363" alt="KIRU — hair by night">
        </picture>
          <span class="tapa tapa--word" aria-hidden="true"></span>
          <span class="tapa tapa--line" aria-hidden="true"></span>
          <span class="tapa tapa--tag" aria-hidden="true"></span>
          <span class="tapa tapa--kanji" aria-hidden="true"></span>
      </a>
    </h1>
  </header>

  <main id="main-content">
    <section id="reservation-box" aria-label="Make a reservation">

      <!--
        The real Setmore booking page, embedded.

        Setmore sends no X-Frame-Options and no frame-ancestors directive, so
        the booking page can be framed cross-origin - verified by loading it in
        a frame and confirming the flow renders, not assumed from the docs. It
        IS Setmore, so availability, services and prices are live and every
        booking lands in the owner's Setmore calendar the moment it is made.
        Nothing to sync, no backend, and the visitor never leaves the site.

        Two honest caveats, both the account owner's to settle:
          - the frame renders in whatever theme the Setmore account is set to
            (currently dark, against this paper page). Setmore > Booking Page >
            appearance changes it.
          - Setmore loads its own analytics and shows its own cookie notice
            inside the frame. That is why the zero-third-party claim in the
            README is scoped to every page except this one.
      -->
      <div class="booking">
        <iframe
          class="booking__frame"
          src="https://labibookings.setmore.com/labibookings"
          title="Book an appointment"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <p class="reserve-fallback">
        Trouble with the form? <a href="https://labibookings.setmore.com/labibookings" target="_blank" rel="noopener noreferrer">Open the booking page directly</a>.
      </p>

    </section>
  </main>

  <footer id="main-footer">
    <p class="direction">KLAPDORP 37, 2000 Antwerpen</p>
    <p class="link"><a href="mailto:alabivof@gmail.com">alabivof@gmail.com</a></p>
    <p class="instagram"><a href="https://www.instagram.com/labi_antwerp/" target="_blank" rel="noopener noreferrer">labi_antwerp</a></p>
  </footer>

</div>

<script>
(function () {
  var root = document.documentElement;
  root.className += (root.className ? ' ' : '') + 'js';
  var page = document.querySelector('.page');
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { page.classList.add('is-revealed'); });
  });
})();
</script>
</body>
</html>
